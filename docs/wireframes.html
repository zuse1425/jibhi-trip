<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>

<header class="top"><h1>Trip app wireframes v1</h1>
<p>Low-fidelity screens for feature 002 (trip platform). Times, places and amounts are sample data. Colours follow docs/design-system.md. Source canvas: exported from the design artifact on 10 Nov 2026.</p></header>
<main>
<figure id="main"><figcaption><b>1 · Trips</b><span>I sign in and see only my trips; I open one or start a new one.</span></figcaption><div class="phone"><div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #14213D; font-family: Plus Jakarta Sans,system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 28px 20px 16px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Your trips</h1>
    <button type="button" aria-label="Account" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D1D5DB; background: #F3F4F6; color: #14213D; font: 600 15px Plus Jakarta Sans,sans-serif">N</button>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 20px">
    <a href="#today" style="display: flex; flex-direction: column; border: 1px solid #D1D5DB; border-radius: 16px; overflow: hidden; text-decoration: none; color: #14213D">
      <div style="height: 150px; background: #E0F2FE; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #4B5563; border-bottom: 1px solid #D1D5DB">Cover photo</div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px">
        <div style="font-size: 19px; font-weight: 700">Jibhi · Jalori · Tirthan</div>
        <div style="font-size: 14px; color: #4B5563">13 to 16 Nov · 4 people</div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
          <span style="font-size: 13px; font-weight: 600; color: #14213D; background: #FFC93C; border-radius: 999px; padding: 6px 12px">Starts in 3 days</span>
          <div style="display: flex">
            <span style="width: 28px; height: 28px; border-radius: 14px; background: #E5E7EB; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">N</span>
            <span style="width: 28px; height: 28px; border-radius: 14px; background: #E5E7EB; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: -8px">M</span>
            <span style="width: 28px; height: 28px; border-radius: 14px; background: #E5E7EB; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: -8px">H</span>
            <span style="width: 28px; height: 28px; border-radius: 14px; background: #E5E7EB; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: -8px">S</span>
          </div>
        </div>
      </div>
    </a>

    <a href="#newtrip" style="display: flex; align-items: center; justify-content: center; height: 56px; border: 1.5px dashed #6B7280; border-radius: 16px; font-size: 16px; font-weight: 600; color: #14213D; text-decoration: none">+ New trip</a>

    <p style="margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #4B5563; text-align: center">You only see trips you have been added to.</p>
  </div>
</div></div></figure>
<figure id="newtrip"><figcaption><b>2 · New trip</b><span>I name the trip, set dates, add friends by email, then let AI draft the plan or start blank.</span></figcaption><div class="phone"><div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #14213D; font-family: Plus Jakarta Sans,system-ui, sans-serif">
  <header style="display: flex; align-items: center; gap: 8px; padding: 20px 20px 12px">
    <a href="#main" style="display: flex; align-items: center; height: 44px; padding-right: 12px; font-size: 15px; font-weight: 600; color: #14213D; text-decoration: none">Back</a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">New trip</h1>
  </header>

  <form style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="newtrip-nt-name" style="font-size: 13px; font-weight: 600; color: #4B5563">Trip name</label>
      <input id="newtrip-nt-name" type="text" placeholder="Goa in January" style="height: 48px; box-sizing: border-box; border: 1px solid #9CA3AF; border-radius: 12px; padding: 0 14px; font: 400 16px Plus Jakarta Sans,sans-serif; color: #14213D; background: #FFFFFF">
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="newtrip-nt-from" style="font-size: 13px; font-weight: 600; color: #4B5563">From</label>
        <input id="newtrip-nt-from" type="text" placeholder="Start date" style="height: 48px; box-sizing: border-box; border: 1px solid #9CA3AF; border-radius: 12px; padding: 0 14px; font: 400 16px Plus Jakarta Sans,sans-serif; color: #14213D; background: #FFFFFF">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="newtrip-nt-to" style="font-size: 13px; font-weight: 600; color: #4B5563">To</label>
        <input id="newtrip-nt-to" type="text" placeholder="End date" style="height: 48px; box-sizing: border-box; border: 1px solid #9CA3AF; border-radius: 12px; padding: 0 14px; font: 400 16px Plus Jakarta Sans,sans-serif; color: #14213D; background: #FFFFFF">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="newtrip-nt-people" style="font-size: 13px; font-weight: 600; color: #4B5563">People, by Google email</label>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="font-size: 14px; font-weight: 500; background: #F3F4F6; border: 1px solid #D1D5DB; border-radius: 999px; padding: 7px 12px">You</span>
        <span style="font-size: 14px; font-weight: 500; background: #F3F4F6; border: 1px solid #D1D5DB; border-radius: 999px; padding: 7px 12px">Mitali</span>
        <span style="font-size: 14px; font-weight: 500; background: #F3F4F6; border: 1px solid #D1D5DB; border-radius: 999px; padding: 7px 12px">Himanshu</span>
      </div>
      <input id="newtrip-nt-people" type="email" placeholder="Add an email" style="height: 48px; box-sizing: border-box; border: 1px solid #9CA3AF; border-radius: 12px; padding: 0 14px; font: 400 16px Plus Jakarta Sans,sans-serif; color: #14213D; background: #FFFFFF">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="newtrip-nt-brief" style="font-size: 13px; font-weight: 600; color: #4B5563">Describe the trip (optional, for the AI draft)</label>
      <textarea id="newtrip-nt-brief" placeholder="4 friends, mountains, cafes, one easy hike, cab from Hoshiarpur" style="height: 112px; box-sizing: border-box; border: 1px solid #9CA3AF; border-radius: 12px; padding: 12px 14px; font: 400 16px/1.4 Plus Jakarta Sans,sans-serif; color: #14213D; background: #FFFFFF; resize: none"></textarea>
    </div>

    <div style="flex: 1"></div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: #FFC93C; color: #14213D; font: 600 16px Plus Jakarta Sans,sans-serif">Draft the plan with AI</button>
      <button type="button" style="height: 52px; border: 1px solid #9CA3AF; border-radius: 14px; background: #FFFFFF; color: #14213D; font: 600 16px Plus Jakarta Sans,sans-serif">Start with a blank plan</button>
    </div>
  </form>
</div></div></figure>
<figure id="today"><figcaption><b>3 · Today</b><span>I open the app and see my own next step, what the group does next, and where everyone is.</span></figcaption><div class="phone"><div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #14213D; font-family: Plus Jakarta Sans,system-ui, sans-serif">

      <a href="#main" style="font-size: 13px; font-weight: 500; color: #4B5563; text-decoration: none">Jibhi · Jalori · Tirthan</a>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Fri 13 Nov</h1>
    </div>
    <span style="font-size: 15px; font-weight: 600; color: #4B5563; padding-bottom: 4px">6:10 am</span>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 2px 20px 16px; overflow: hidden">
    <section style="display: flex; flex-direction: column; gap: 10px; border: 1.5px solid #FFC93C; background: #FFF8E1; border-radius: 16px; padding: 16px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0369A1">YOUR NEXT STEP</div>
      <div style="font-size: 19px; font-weight: 700; line-height: 1.25">Bus to Hoshiarpur</div>
      <div style="font-size: 14px; line-height: 1.45; color: #4B5563">Left Mohali ISBT 4:30 · arrive about 7:30</div>
      <div style="display: flex; gap: 10px; margin-top: 2px">
        <a href="#map" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #FFC93C; color: #14213D; font-size: 15px; font-weight: 600; text-decoration: none">Directions</a>
        <a href="#plan" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; border: 1px solid #9CA3AF; color: #14213D; font-size: 15px; font-weight: 600; text-decoration: none">Full plan</a>
      </div>
    </section>

    <section style="display: flex; align-items: center; gap: 14px; border: 1px solid #D1D5DB; border-radius: 16px; padding: 14px 16px">
      <div style="font-size: 15px; font-weight: 700; width: 48px">8:00</div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #4B5563">THEN, EVERYONE</div>
        <div style="font-size: 16px; font-weight: 600">Meet at Hoshiarpur Bus Stand</div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; border: 1px solid #D1D5DB; border-radius: 16px; padding: 6px 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0 6px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #4B5563">WHERE EVERYONE IS</h2>
        <a href="#map" style="display: flex; align-items: center; height: 32px; font-size: 14px; font-weight: 600; text-decoration: none">Map</a>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #E5E7EB">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #E5E7EB; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">M</span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <div style="font-size: 15px; font-weight: 600">Mitali</div>
          <div style="font-size: 13px; color: #4B5563">On the bus from Pathankot</div>
        </div>
        <div style="font-size: 13px; font-weight: 600; text-align: right">about 7:40</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #E5E7EB">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #E5E7EB; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">H</span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <div style="font-size: 15px; font-weight: 600">Himanshu and Sirisha</div>
          <div style="font-size: 13px; color: #4B5563">Cab from Ludhiana, left 6:00</div>
        </div>
        <div style="font-size: 13px; font-weight: 600; text-align: right">about 7:45</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #E5E7EB">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #E5E7EB; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">N</span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <div style="font-size: 15px; font-weight: 600">You</div>
          <div style="font-size: 13px; color: #4B5563">On the bus from Mohali</div>
        </div>
        <div style="font-size: 13px; font-weight: 600; text-align: right">about 7:30</div>
      </div>
    </section>

    <section style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid #D1D5DB; border-radius: 16px; padding: 12px 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">Share my location</div>
        <div style="font-size: 13px; color: #4B5563">Only while the app is open</div>
      </div>
      <button type="button" aria-label="Share my location, on" style="width: 52px; height: 32px; border-radius: 16px; border: 0; background: #047857; padding: 3px; display: flex; justify-content: flex-end; flex-shrink: 0"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span></button>
    </section>
  </div>

  <nav style="display: flex; height: 64px; flex-shrink: 0; border-top: 1px solid #D1D5DB; background: #FFFFFF">
    <a href="#today" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: #0369A1; text-decoration: none"><span style="width: 20px; height: 3px; border-radius: 2px; background: #FFC93C"></span>Today</a>
    <a href="#plan" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4B5563; text-decoration: none"><span style="width: 20px; height: 3px; border-radius: 2px; background: transparent"></span>Plan</a>
    <a href="#explore" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4B5563; text-decoration: none"><span style="width: 20px; height: 3px; border-radius: 2px; background: transparent"></span>Explore</a>
    <a href="#chat" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4B5563; text-decoration: none"><span style="width: 20px; height: 3px; border-radius: 2px; background: transparent"></span>Chat</a>
    <a href="#money" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4B5563; text-decoration: none"><span style="width: 20px; height: 3px; border-radius: 2px; background: transparent"></span>Money</a>
  </nav>
</div></div></figure>
<figure id="plan"><figcaption><b>4 · Plan, list</b><span>I see one day as a simple timeline; I tap a stop to edit it or add one.</span></figcaption><div class="phone"><div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #14213D; font-family: Plus Jakarta Sans,system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 24px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Plan</h1>
    <div style="display: flex; border: 1px solid #9CA3AF; border-radius: 12px; overflow: hidden">

      <a href="#map" style="display: flex; align-items: center; height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600; color: #14213D; text-decoration: none">Map</a>
    </div>
  </header>

  <div style="display: flex; gap: 8px; padding: 4px 20px 12px">
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FFC93C; color: #14213D; font: 600 14px Plus Jakarta Sans,sans-serif">Fri 13</button>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #9CA3AF; background: #FFFFFF; color: #14213D; font: 600 14px Plus Jakarta Sans,sans-serif">Sat 14</button>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #9CA3AF; background: #FFFFFF; color: #14213D; font: 600 14px Plus Jakarta Sans,sans-serif">Sun 15</button>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #9CA3AF; background: #FFFFFF; color: #14213D; font: 600 14px Plus Jakarta Sans,sans-serif">Mon 16</button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 0 20px 16px; overflow: hidden">
    <div style="display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #E5E7EB">

      </div>
      <a href="#map" style="display: flex; align-items: center; height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">Go</a>
    </div>

    <div style="display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #E5E7EB">
      <div style="width: 48px; font-size: 15px; font-weight: 700">10:00</div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex: 1">
        <div style="font-size: 16px; font-weight: 600">Drive to Jibhi</div>
        <div style="font-size: 13px; color: #4B5563">About 6 hours with a lunch stop</div>
      </div>
      <a href="#map" style="display: flex; align-items: center; height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">Go</a>

      </div>

      <div style="display: flex; flex-direction: column; gap: 3px; flex: 1">
